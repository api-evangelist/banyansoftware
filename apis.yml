aid: banyansoftware
name: Banyansoftware
description: 'Banyan Software is a global acquirer and permanent operator of vertical
  market software (VMS) businesses, headquartered in Toronto, Canada. Built as an
  "evergreen" alternative to private equity, Banyan buys profitable, growing enterprise
  software companies that hold dominant positions in niche markets (typically $2M-$30M
  in annual revenue) and holds them for the long term rather than reselling. It has
  acquired 100+ companies across sectors including healthcare IT, education, manufacturing,
  broadcast, public sector, and fintech, and supports them through a Growth Ops team
  spanning AI, talent, sales and marketing, payments, product, finance, cybersecurity,
  and legal. Banyan Software is a holding/operating company and does not currently
  publish a public developer API, developer portal, or API documentation.'
